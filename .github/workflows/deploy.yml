name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inject Mapbox Token
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          sed -i "s|YOUR_MAPBOX_ACCESS_TOKEN|${MAPBOX_TOKEN}|g" map.html

      - name: Verify token injection
        run: |
          if grep -q 'YOUR_MAPBOX_ACCESS_TOKEN' map.html; then
            echo "ERROR: Token injection failed — placeholder still present in map.html"
            exit 1
          fi
          echo "Token injection verified."

          grep "pk." map.html || echo "Token not found in map.html!"
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
